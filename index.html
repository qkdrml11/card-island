<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#123c44">
<meta name="format-detection" content="telephone=no">
<title>카드 무인도 — 프로토타입</title>
<style>
:root{--cw:70px;--ch:92px;--hud:#123c44;--ink:#1d2b2f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;overscroll-behavior:none;background:#0d2e35;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;color:var(--ink);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%}
#app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:560px;margin:0 auto;
  padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
#hud{background:var(--hud);color:#eef7f5;padding:6px 8px 6px;flex:none;touch-action:none}
#hud .r1{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:700;white-space:nowrap}
#hud .r1 .sp{flex:1}
#hud .chip{background:rgba(255,255,255,.12);border-radius:10px;padding:2px 7px;font-size:12px;font-weight:600}
#hud .chip.warn{background:#b8442e}
#hud button.chip{border:0;color:inherit;font:inherit;font-size:15px;min-width:40px;min-height:30px;padding:2px 8px;touch-action:manipulation}
#sheet .seg{display:flex;gap:6px;align-items:center;margin:6px 0}
#sheet .seg>span{width:58px;flex:none;font-weight:700;font-size:14px}
#sheet .seg button{flex:1;min-height:42px;padding:0 4px}
#sheet .seg button.on{background:#ffd36b;outline:2px solid #d9a400}
#bars{display:grid;grid-template-columns:1fr 1fr auto;gap:4px 8px;margin-top:5px}
#thermo{grid-column:3;grid-row:1/3;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:9px;padding:1px 6px;min-width:62px;background:rgba(255,255,255,.12);line-height:1.15}
#thermo .tv{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
#thermo .tl{font-size:10.5px;font-weight:700;white-space:nowrap}
#thermo.th-cool{background:#3f6f9e} #thermo.th-cold{background:#2a62c9;box-shadow:0 0 0 2px #8fc3ff inset}
#thermo.th-warm{background:#c9772a} #thermo.th-hot{background:#c7392b;box-shadow:0 0 0 2px #ffb199 inset}
.bar2{display:flex;align-items:center;gap:5px;font-size:11.5px}
.bar2 .lb{width:44px;flex:none;opacity:.9}
.bar2 .tr{flex:1;height:10px;background:rgba(255,255,255,.15);border-radius:6px;overflow:hidden}
.bar2 .tr i{display:block;height:100%;border-radius:6px;transition:width .3s}
.bar2 .v{width:24px;text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.bar2.bad .v{color:#ff9b85}
#board{position:relative;flex:1;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;
  background:linear-gradient(#e9d7a8,#d9c08a);transition:background .6s}
#app.night #board{background:linear-gradient(#26364f,#1a2638)}
#app.rain #board{box-shadow:inset 0 0 60px rgba(70,110,160,.45)}
#app.storm #board{background:linear-gradient(#4a5260,#2c333d);box-shadow:inset 0 0 90px rgba(20,30,60,.7)}
#hud .r1{overflow:hidden}
#field{position:relative;width:100%;min-height:100%}
#toolbar{flex:none;display:flex;gap:6px;padding:6px 8px;background:var(--hud);touch-action:manipulation}
#toolbar button{flex:1;min-height:44px;border:0;border-radius:12px;background:#f3e7c7;color:#1d2b2f;font-size:14px;font-weight:700;font-family:inherit;touch-action:manipulation}
#toolbar button:active{transform:scale(.96)}
#toolbar button.pri{background:#ffd36b}
.card{position:absolute;left:0;top:0;width:var(--cw);height:var(--ch);touch-action:none;will-change:transform;
  transition:transform .18s ease-out}
.card.dragging{transition:none;pointer-events:none;z-index:100000!important}
.card.dragging .ci{box-shadow:0 10px 22px rgba(0,0,0,.35);transform:scale(1.05) rotate(-1.5deg)}
.card.hl .ci{outline:3px solid #ffef5a;outline-offset:1px}
.ci{position:relative;width:100%;height:100%;border-radius:10px;border:2px solid #7b6a49;background:#fff8e6;
  display:flex;flex-direction:column;align-items:center;overflow:hidden;box-shadow:0 2px 4px rgba(0,0,0,.25);
  animation:pop .22s ease-out;transition:transform .12s}
@keyframes pop{from{transform:scale(.6);opacity:.2}to{transform:scale(1);opacity:1}}
.ci .nm{width:100%;height:22px;line-height:21px;text-align:center;font-size:calc(var(--cw)*.158);font-weight:800;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 3px;letter-spacing:-.4px;background:rgba(0,0,0,.07);flex:none}
.ci .em{font-size:calc(var(--cw)*.42);line-height:1;margin-top:3px;flex:none}
.ci .ft{font-size:calc(var(--cw)*.138);line-height:1.15;margin-top:3px;text-align:center;font-weight:600;opacity:.85;padding:0 2px;letter-spacing:-.3px}
.ci .br{position:absolute;left:6px;right:6px;bottom:4px;height:4px;background:rgba(0,0,0,.15);border-radius:3px;overflow:hidden}
.ci .br i{display:block;height:100%;background:#3c9d5d}
.ci.pl .em{margin-right:24px}
.ci .badge{position:absolute;right:2px;top:25px;min-width:30px;height:26px;line-height:26px;padding:0 5px;border-radius:12px;
  background:#1d2b2f;color:#fff;font-size:13px;font-weight:800;text-align:center}
.ci .cook{position:absolute;right:2px;top:22px;background:#fff;border-radius:8px;padding:1px 3px;font-size:16px;line-height:1.1;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.ci .cook small{display:block;font-size:9px;font-weight:700}
.c-place{background:#d6f0e4;border-color:#2f7d5d}
.c-res{background:#fff3d6;border-color:#9a7b45}
.c-food{background:#ffe3cc;border-color:#c26a2e}
.c-water{background:#dcefff;border-color:#3d7cb8}
.c-tool{background:#e3e9f0;border-color:#4d6075}
.c-fac{background:#ead8c0;border-color:#7a4e27}
.c-fire{background:#ffd9b0;border-color:#d4471f}
.c-fire .em{animation:flick 1.2s infinite alternate}
@keyframes flick{from{transform:scale(1)}to{transform:scale(1.08) rotate(2deg)}}
.c-dead{background:#d9d9d9;border-color:#777}
.c-dead .em,.dimem .em{filter:grayscale(1) opacity(.7)}
.ci.locked{opacity:.55}
.ci.rotten{background:#cfd6b8}
#app.night .ci{filter:brightness(.88)}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 64px);width:min(92vw,420px);z-index:200000;pointer-events:none;display:flex;flex-direction:column;gap:5px;align-items:center}
.toast{background:rgba(20,30,34,.9);color:#fff;padding:7px 12px;border-radius:12px;font-size:13.5px;font-weight:600;box-shadow:0 4px 12px rgba(0,0,0,.3);animation:tin .2s ease-out;max-width:100%;text-align:center;line-height:1.35}
.toast.disc{background:#ffd36b;color:#3a2a00;font-weight:800}
.toast.bad{background:#b8442e}
.toast.good{background:#2f7d5d}
@keyframes tin{from{transform:translateY(-8px);opacity:0}to{transform:none;opacity:1}}
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300000;display:flex;align-items:flex-end;justify-content:center}
#overlay[hidden]{display:none}
#sheet{background:#fff8e6;width:100%;max-width:560px;max-height:88%;overflow-y:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));touch-action:pan-y;-webkit-overflow-scrolling:touch;-webkit-user-select:text;user-select:text}
#sheet h2{margin:0 0 8px;font-size:20px}
#sheet h3{margin:14px 0 6px;font-size:15px}
#sheet p,#sheet li{font-size:14px;line-height:1.5}
#sheet ul{padding-left:20px;margin:6px 0}
#sheet .btns{display:flex;flex-direction:column;gap:8px;margin-top:12px}
#sheet button{min-height:46px;border:0;border-radius:12px;background:#f0e2bd;font-size:15px;font-weight:700;font-family:inherit;color:#1d2b2f;touch-action:manipulation}
#sheet button.pri{background:#ffd36b}
#sheet button.danger{background:#f3b1a6}
.c-fac.compost{background:#d9c9a8}
#sheet button:disabled{opacity:.4}
#sheet .rcp{display:flex;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid #eadfc4;font-size:14px}
#sheet .rcp .e{font-size:24px;width:32px;text-align:center}
#sheet .rcp.unk .e{filter:grayscale(1) brightness(.2)}
#sheet .rcp small{color:#6b5c3c;display:block}
#sheet .score td{padding:3px 6px;font-size:14px}
#sheet .score td:last-child{text-align:right;font-weight:700}
.trait{display:flex;align-items:center;gap:8px;padding:9px;border-radius:12px;background:#f6ecd2;margin:6px 0}
.trait.sel{background:#ffe6a0;outline:2px solid #d9a400}
.trait .tx{flex:1;font-size:13.5px;line-height:1.35}
.trait .tx b{font-size:15px}
.trait button{min-height:40px!important;padding:0 10px}
.trait.hid{opacity:.55}
.big{font-size:40px;text-align:center}
.muted{color:#7a6a48;font-size:13px}
</style>
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="r1"><span id="clock">1일차 07:00</span><span id="dn" class="chip">☀️ 낮</span><span id="wx" class="chip">맑음</span><span id="fx"></span><span class="sp"></span><button id="bSnd" class="chip" aria-label="소리 켜기/끄기">🔊</button><span id="pts" class="chip">✦ 0</span></div>
    <div id="bars"></div>
  </header>
  <main id="board"><div id="field"></div></main>
  <footer id="toolbar">
    <button id="bSort" class="pri">정렬</button>
    <button id="bBook">📖 도감</button>
    <button id="bLog">📜 기록</button>
    <button id="bHelp">❓</button>
    <button id="bMenu">⋯</button>
  </footer>
</div>
<div id="toasts"></div>
<div id="overlay" hidden><div id="sheet"></div></div>
<script>
'use strict';
/* ====== 카드 무인도 프로토타입 (기획서 v0.3 기준, 수치는 임시값) ====== */
const $ = s => document.querySelector(s);
const clamp = (v, a = 0, b = 100) => Math.max(a, Math.min(b, v));
const pad = n => String(n).padStart(2, '0');
const rnd = () => Math.random();
const VERSION = 4;
const RUN_KEY = 'cardIsland.run.v1', META_KEY = 'cardIsland.meta.v1';

/* ---------- 카드 종류 ---------- */
const K = {
  beach:{n:'해변',e:'🏖️',cat:'place'}, sea:{n:'얕은 바다',e:'🌊',cat:'place'}, jungle:{n:'정글',e:'🌴',cat:'place'},
  ledge:{n:'바위턱',e:'⛰️',cat:'place'}, base:{n:'기지',e:'🏕️',cat:'place'}, flat:{n:'갯벌',e:'🏝️',cat:'place'},
  valley:{n:'민물 계곡',e:'🏞️',cat:'place',locked:1}, cave:{n:'동굴',e:'🕳️',cat:'place',locked:1},
  stone:{n:'돌',e:'🪨',cat:'res'}, stick:{n:'나뭇가지',e:'🥢',cat:'res'}, leaf:{n:'잎',e:'🍃',cat:'res'},
  fiber:{n:'섬유',e:'🌾',cat:'res'}, vine:{n:'덩굴',e:'➰',cat:'res'}, bent:{n:'휜 가지',e:'🪃',cat:'res'},
  flint:{n:'부싯돌',e:'💠',cat:'res'}, plank:{n:'떠밀려 온 나무판',sn:'나무판',e:'🟫',cat:'res'},
  log:{n:'통나무',e:'🪵',cat:'res'}, bigclam:{n:'큰 조개',e:'🦪',cat:'res'}, rope:{n:'노끈',e:'🧶',cat:'res'}, bone:{n:'생선뼈',e:'🦴',cat:'res'},
  clam:{n:'조개',e:'🐚',cat:'food',eat:{h:5,sick:.10},cook:'clamc',raw:1},
  clamc:{n:'구운 조개',e:'🥘',cat:'food',eat:{h:10},spoil:1440},

  fishk:{n:'손질한 생선',e:'🐠',cat:'food',eat:{h:12,sick:.30},cook:'fishkc',spoil:720,raw:1},

  weed:{n:'해초',e:'🌱',cat:'food',eat:{h:4}},
  coco:{n:'코코넛',e:'🥥',cat:'food',closed:1},
  cocoo:{n:'깬 코코넛',e:'🥛',cat:'food',eat:{h:8,t:20},spoil:4320},
  rotten:{n:'상한 음식',e:'🤢',cat:'food',eat:{h:3,sick:1}},
  rainw:{n:'고인 빗물',e:'💧',cat:'water',eat:{t:25,sick:.25}},
  sharp:{n:'날 선 돌',e:'🔺',cat:'tool',dur:8}, knife:{n:'칼',e:'🔪',cat:'tool',dur:12},
  spear:{n:'창',e:'🔱',cat:'tool',dur:10}, rod:{n:'낚싯대',e:'🎣',cat:'tool',dur:8},
  drill:{n:'손드릴',e:'🌀',cat:'tool',dur:6}, torch:{n:'횃불',e:'🕯️',cat:'tool',dur:4},
  torchx:{n:'꺼진 횃불',e:'🕯️',cat:'dead'},
  ember:{n:'불씨',e:'✨',cat:'fire'}, fire:{n:'모닥불',e:'🔥',cat:'fire'}, firex:{n:'꺼진 모닥불',e:'🌫️',cat:'dead'},
  bed:{n:'침상',e:'🛏️',cat:'fac'}, catcher:{n:'빗물 받이',e:'🪣',cat:'fac'}, windbreak:{n:'바람막이',e:'⛺',cat:'fac'},
  fence:{n:'울타리',e:'🚧',cat:'fac'}, hut:{n:'오두막',e:'🛖',cat:'fac'},

const KORDER = Object.keys(K);
const FIXED = new Set(['beach','sea','flat','jungle','ledge','base','valley','cave','fire','firex','bed','catcher','windbreak','fence','hut','compost']);
// 버리기(🌊 얕은 바다): 도구·장소·시설·불은 못 버림 / 퇴비 더미에 넣을 수 있는 것
const canDiscard = c => !FIXED.has(c.k) && !['tool','place','fac'].includes(K[c.k].cat);
const COMPOSTABLE = new Set(['rotten','bone','weed']);
const COMPOST_MAX = 3, COMPOST_MIN = 1440;
const PLACE_ORDER = ['beach','sea','flat','jungle','ledge','base'];
const CAT_ORDER = {fac:0, fire:1, dead:2, tool:3, food:4, water:5, res:6, place:7};

const RECIPES = [
  {id:'sharp', out:'sharp', inp:{stone:2}, t:10, e:1},

  {id:'campfire', out:'fire', inp:{ember:1, stick:1}, t:10, e:1},
  {id:'torch', out:'torch', inp:{stick:1, fiber:1, ember:1}, t:20, e:2},
  {id:'knife', out:'knife', inp:{sharp:1, flint:1, stick:1}, t:20, e:2},
  {id:'spear', out:'spear', inp:{sharp:1, stick:1, rope:1}, t:20, e:2},
  {id:'rod', out:'rod', inp:{stick:1, rope:1, clam:1}, t:20, e:2},
  {id:'bed', out:'bed', inp:{leaf:2}, t:10, e:1, unique:['bed','windbreak'], fac:1},
  {id:'catcher', out:'catcher', inp:{leaf:2, stick:1}, t:10, e:1, unique:['catcher'], fac:1},
  {id:'windbreak', out:'windbreak', inp:{bed:1, rope:1, stick:2}, t:40, e:5, unique:['windbreak'], up:'bed'},
  {id:'fence', out:'fence', inp:{log:3}, t:90, e:5, unique:['fence','hut'], fac:1},
  {id:'hut', out:'hut', inp:{fence:1, log:2, leaf:3}, t:180, e:15, unique:['hut'], up:'fence'},
  {id:'compost', out:'compost', inp:{stick:2, leaf:2}, t:20, e:2, unique:['compost'], fac:1},
];
// 도감 표시용 (모든 발견 가능 조합)
const BOOK = [
  ['sharp','🔺','날 선 돌','🪨 돌 + 🪨 돌'],
  ['rope','🧶','노끈','🌾 섬유 + 🌾 섬유 (덩굴 ➰ 1개는 노끈 대신 쓸 수 있음)'],
  ['drill','🌀','손드릴','🥢 나뭇가지 + 🥢 나뭇가지'],
  ['ember','✨','불씨','🌀 손드릴(도구) + 🌾 섬유 · 성공 70% (비 40%) · 30분 안에 써야 함','drill'],
  ['campfire','🔥','모닥불','✨ 불씨 + 🥢 나뭇가지 · 연료 3시간','ember'],
  ['fuel','🔥','모닥불 연료','🥢 나뭇가지(+2시간) / 🪵 통나무(+6시간) → 🔥 모닥불','campfire'],
  ['relightfire','🔥','모닥불 다시 피우기','✨ 불씨 → 🌫️ 꺼진 모닥불','campfire'],
  ['torch','🕯️','횃불','🥢 나뭇가지 + 🌾 섬유 + ✨ 불씨 · 내구 4 (밤 살피기 1회당 −1)','ember'],
  ['relight','🕯️','횃불 다시 붙이기','꺼진 횃불 → 🔥 모닥불 · 불씨 없이 내구 4','torch'],
  ['opencoco','🥛','코코넛 열기','🔺 날 선 돌 / 🔪 칼 → 🥥 코코넛','sharp'],
  ['knife','🔪','칼','🔺 날 선 돌 + 💠 부싯돌 + 🥢 나뭇가지','sharp'],
  ['spear','🔱','창','🔺 날 선 돌 + 🥢 나뭇가지 + 🧶 노끈','sharp'],
  ['rod','🎣','낚싯대','🥢 나뭇가지 + 🧶 노끈 + 🐚 조개','rope'],
  ['fish_spear','🐟','창 낚시','🔱 창 → 🌊 얕은 바다 · 30분, 60%, 기운 −10','spear'],
  ['fish_rod','🐟','낚싯대 낚시','🎣 낚싯대 → 🌊 얕은 바다 · 60분, 70%, 기운 −4','rod'],
  ['chop','🪵','통나무 베기','🔺 날 선 돌(60분) / 🔪 칼(40분) → 🌴 정글','sharp'],
  ['cleanfish','🐠','생선 손질','🔪 칼 → 🐟 생선 · 생선뼈 1','knife'],
  ['cleancrab','🦀','게 손질','🔪 칼 → 🦀 게','knife'],
  ['cook_clamc','🥘','구운 조개','🐚 조개 → 🔥 모닥불 (20분)','campfire'],
  ['cook_crabc','🍤','구운 게','🦀 게 → 🔥 모닥불 (20분)','campfire'],
  ['cook_crabkc','🍤','손질 게구이','🦀 손질한 게 → 🔥 모닥불 (20분)','cleancrab'],

function tideWindows(d) { const c = (d - 1) % 7, b = (d - 1) * 1440; return [[b + (9 + c) * 60, b + (11 + c) * 60], [b + (21 + c) * 60, b + (23 + c) * 60]]; }

function restRate() {

/* ---------- 〔v0.5 확정: 체온·폭풍 강화〕 체온 (℃, 정상 36.5, 임시값) ----------
   식힘(/시간): 폭풍 중이면 폭풍 값만 (오두막 0 / 바람막이 0.25 / 없음 0.5), 아니면 비(바람막이·오두막 없을 때) 0.15 + 밤 야외(오두막 없을 때) 0.1
   데움(36.5 아래일 때만, 36.5를 넘기지 않음): 켜진 모닥불 0.3 + 오두막에서 쉬기 0.4 + 맑은 낮 0.1 + 식힘 없을 때 몸 스스로 0.1 + 오한(36.0 아래) 몸 떨림 0.15
   열(오름): 배탈 중 0.25, 다친 지 6시간 넘은 부상(염증) 0.1, 맑은 낮에 수분 20 이하로 살피기 1번마다 +0.3 (열사병)
   열 내림(36.5 위, 열 원인 없을 때): 0.2, 쉬면서 수분 30 초과면 0.4. 물 마시기 −0.3 */
const TEMP_N = 36.5;
const TBANDS = [[33, '심한 저체온', 'cold'], [35, '저체온', 'cold'], [36, '오한', 'cool'], [37.5, '정상', 'ok'], [38.5, '미열', 'warm'], [40, '고열', 'hot'], [99, '위험한 고열', 'hot']];
function tband(t = S.temp) { // 오한 35.0~36.0, 미열 37.5 초과~38.5 …
  for (let i = 0; i < TBANDS.length; i++) { const [lim, nm, cl] = TBANDS[i]; if (i < 3 ? t < lim : t <= lim) return {i, nm, cl}; }
  return {i:6, nm:'위험한 고열', cl:'hot'};
}
function tempRate(rest) {
  const hut = hasHut(), wb = !!findKind('windbreak'), n = isNight();
  let cool = 0, warm = 0, fever = 0;
  if (S.storm) cool = hut ? 0 : wb ? .25 : .5;
  else { if (S.rain && !hut && !wb) cool += .15; if (n && !hut) cool += .1; }
  if (findKind('fire')) warm += .3;
  if (rest && hut) warm += .4;
  if (!S.rain && !S.storm && !n) warm += .1;
  if (!cool) warm += .1;
  if (S.temp < 36) warm += .15;
  if (S.sick > 0) fever += .25;
  if (S.injured > 0 && S.injured <= 1080) fever += .1;
  const down = fever ? 0 : (rest && S.thirst > 30 ? .4 : .2);
  const net = S.temp < TEMP_N ? warm + fever - cool : S.temp > TEMP_N ? fever - cool - down : fever - cool;
  return {cool, warm, fever, down, net};
}
function stepTemp(rest) {
  const t0 = S.temp, r = tempRate(rest), b0 = tband(t0);
  let t = t0 + r.net / 60;
  if (!r.fever && t0 < TEMP_N && t > TEMP_N) t = TEMP_N; // 데움은 36.5를 넘기지 않음
  if (!r.cool && t0 > TEMP_N && t < TEMP_N) t = TEMP_N;  // 열 내림도 36.5에서 멈춤
  S.temp = clamp(t, 28, 43);
  tempMsg(b0);
}
function tempMsg(b0) {
  const b = tband();
  if (b.i === b0.i) return;
  const worse = Math.abs(b.i - 3) > Math.abs(b0.i - 3);
  const msg = {0:'🥶 심한 저체온! 체력 −8/시간 — 당장 몸을 녹이자', 1:'🥶 저체온! 체력 −3/시간, 기운 회복 절반 — 🔥 모닥불이나 🛖 오두막으로', 2:'🥶 오한이 든다 (기운 소모 +25%)',
               4:'🤒 미열이 난다 (수분 −30% 더 빨리)', 5:'🤒 고열! 체력 −3/시간, 수분 −60% 더 빨리 — 쉬면서 물을 마시자', 6:'🔥 위험한 고열! 체력 −8/시간'};
  if (worse && msg[b.i]) say(`${msg[b.i]} (체온 ${S.temp.toFixed(1)}℃)`, 'bad');
  else if (!worse && b.i === 3) say(`🌡️ 체온이 돌아왔다 (${S.temp.toFixed(1)}℃)`, 'good');
}
function heatUp(v, why) { const b0 = tband(); S.temp = clamp(S.temp + v, 28, 43); say(why, 'bad'); tempMsg(b0); }
function coolDrink() { if (S.temp > TEMP_N) { const b0 = tband(); S.temp = Math.max(TEMP_N, S.temp - .3); tempMsg(b0); return ' 열 −0.3℃'; } return ''; }
function advance(min, mode = 'awake') {
  const rest = mode === 'rest';
  for (let i = 0; i < min && !S.dead; i++) {
    S.t++;
    const m = mod();
    const sleepy = rest && !S.storm; // 폭풍 중에는 잠을 못 자서 깨어 있을 때 속도
    // 〔v0.5 확정: 상태 100 기준〕 hunger = 포만감, thirst = 수분 (100 = 가득, 시간이 지나면 줄어듦, 0이면 체력 감소)
    S.hunger = clamp(S.hunger - (sleepy ? 2 : 4) / 60);
    let th = (sleepy ? 2 : 5) / 60;
    const tb = tband().i; // 미열 수분 감소 +30%, 고열 이상 +60%
    if (tb === 4) th *= 1.3; else if (tb >= 5) th *= 1.6;
    if (S.sick > 0) { th *= 2; S.sick--; if (!S.sick) say('배탈이 가라앉았다.'); }
    S.thirst = clamp(S.thirst - th);
    if (S.hunger <= 0) dmg(4 / 60, '굶주림');
    if (S.thirst <= 0) dmg(6 / 60, '탈수');
    if (S.injured > 0) { dmg(2 / 60, '부상'); S.injured--; if (!S.injured) say('부상이 나았다.', 'good'); }
    if (rest) {
      const rr = restRate(); let r = rr.r;
      if (S.storm) r = rr.hut ? 8 : 0; // 폭풍: 오두막이면 침상 수준, 아니면 회복 없음
      else {
        if (isNight()) r *= 1.25;
        if (S.rain && !rr.hut) r *= rr.wb ? .75 : .5;
      }
      if (S.hunger <= 20 || S.thirst <= 20) r *= .5;
      if (tband().i <= 1) r *= .5; // 저체온: 기운 회복 절반
      S.energy = clamp(S.energy + r / 60);
      if (S.hunger > 30 && S.thirst > 30 && (!S.storm || rr.hut)) S.hp = clamp(S.hp + (rr.hut ? 4 : 2) / 60);
    }
    if (S.energy <= 0) dmg(3 / 60, '탈진'); // 〔v0.5 확정〕 기운 0 → 체력 −3/시간
    stepTemp(rest);
    { const bi = tband().i; if (bi <= 1) dmg((bi === 0 ? 8 : 3) / 60, '저체온'); else if (bi >= 5) dmg((bi === 6 ? 8 : 3) / 60, '고열'); }
    tickCards();
    stormMinute();

    if (m === 360) dawn();
    if (m === 1080) regenShore();
    if (m === 0) nightBeast();

}
function tickCards() {

    if (c.k === 'fire') {
      c.fuel--;
      if (c.cook && S.t >= c.cook.until) {
        const out = K[c.cook.k].cook; const nc = mk(out);
        spawnNear(nc, st); c.cook = null; discover('cook_' + out); SND.q('catch');
        say(`${K[out].e} ${K[out].n} 완성!`, 'good');
      }
      if (c.fuel <= 0) extinguish(c, st, '연료가 다 타서');
    } else if (c.k === 'compost') {
      const done = (c.items || []).filter(it => S.t >= it.until);
      if (done.length) { c.items = c.items.filter(it => S.t < it.until); for (const _ of done) spawnNear(mk('humus'), st); discover('humus'); SND.q('squelch'); say(`🟤 퇴비가 다 됐다${done.length > 1 ? ' ×' + done.length : ''} (농사용 · 다음 빌드)`, 'good'); }
    } else if (c.k === 'ember' && S.t >= c.exp) { rm.push(c); say('✨ 불씨가 식어 꺼졌다.', 'bad'); }
    else if (c.sp && S.t >= c.sp) { const old = K[c.k].n; c.k = 'rotten'; delete c.sp; say(`🤢 ${old}이(가) 상했다.`); }
  }
  if (rm.length) removeCards(rm);
}
function extinguish(c, st, why) {
  c.k = 'firex'; c.fuel = 0; SND.q('fizzle');
  if (c.cook) { spawnNear(mk(c.cook.k), st); c.cook = null; }
  say(`🔥 모닥불이 꺼졌다 (${why}).`, 'bad');
}
function regenShore() { const p = S.places.beach.pools.shore; p[0] = Math.min(p[1], p[0] + 4); }
function dawn() {
  S.life.surv++;
  regenShore();
  for (const [pk, pools] of Object.entries(REGEN)) for (const [rk, v] of Object.entries(pools)) {
    const p = S.places[pk].pools[rk]; p[0] = Math.min(p[1], p[0] + v);
  }
  const d = day();
  const p = Math.min(.40, .20 + .01 * (d - 1));
  S.rain = rnd() < p;
  S.rainStreak = S.rain ? S.rainStreak + 1 : 0;
  if (!S.rain) { const r = S.places.ledge.pools.rainw; r[0] = Math.max(0, r[0] - 1); }
  say(`🌅 ${d}일차 아침. 살아남았다 (생존 ${S.life.surv}일)${S.rain ? ` — 🌧️ 비가 온다${S.rainStreak > 1 ? ` (${S.rainStreak}일째)` : ''}` : ''}`, 'good');
  if (d % 7 === 0) say('⚠️ 오늘 12:00부터 내일 06:00까지 큰 폭풍이 온다! 오두막과 비축 식량·물을 준비하자.', 'bad');
  else if (hasTrait('stormsense') && (d + 1) % 7 === 0) say('⚠️ (폭풍 감각) 내일 12:00 큰 폭풍이 온다.', 'bad');

}
function rainHour(m) {
  for (const st of S.stacks) for (const c of st.cards) {
    if (c.k === 'fire' && rnd() < .25) extinguish(c, st, '비에 젖어서');
    if (m % 120 === 0 && c.k === 'catcher' && c.water < 3 && !S.storm) c.water++;
  }

}
function nightBeast() {
  if (findKind('fence') || findKind('hut')) return; // 울타리(오두막 포함)는 밤짐승 차단
  const d = day();
  let p = Math.min(.40, .10 + .02 * (d - 1));
  const foods = allCards().filter(c => K[c.k].cat === 'food');
  if (foods.length) p += .15;
  if (findKind('fire')) p *= .5;
  if (rnd() < p) {
    const n = Math.min(foods.length, rnd() < .5 ? 1 : 2);
    const stolen = [];
    for (let i = 0; i < n; i++) { const idx = Math.floor(rnd() * foods.length); stolen.push(foods.splice(idx, 1)[0]); }
    removeCards(stolen);

    say(`🐗 한밤중에 멧돼지가 기지를 덮쳤다! 체력 −15${stolen.length ? ' · 빼앗김: ' + stolen.map(c => K[c.k].n).join(', ') : ''}`, 'bad');

}

/* ---------- 행동 ---------- */
function canAct(e) {
  if (S.dead) return false;
  if (e > 0 && S.energy <= 0) { toast('기운이 없어요 (기운 0이면 체력이 줄어요). 🏕️ 기지를 탭해서 쉬세요.', 'bad'); return false; }
  return true;
}
function act(min, e, fn, mode) {
  const cost = e * (isWet() ? 1.5 : 1) * (S.temp < 36 && S.temp >= 35 ? 1.25 : 1); // 오한: 기운 소모 +25%
  S.energy = clamp(S.energy - cost);

  after();
}
function after() {

}

function getSick() {

function wear(c) {

}
function usableTorch() { return allCards().find(c => c.k === 'torch' && c.dur > 0); }
function canExplore(k) {
  if (k === 'flat') return flatOpen();

  return !!usableTorch() && !isWet();
}

function explore(card) {
  const k = card.k;
  if (k === 'base') return openRest();
  if (K[k].locked) return toast(`${K[k].n}: 다음 빌드에서 열려요 (프로토타입 범위 밖)`);

  let torch = null;
  if (k === 'flat' && !flatOpen()) return toast(S.storm ? '⛈️ 폭풍 중에는 갯벌이 닫혀요.' : `🌊 물이 차 있어요. 다음 썰물 ${whenStr(nextLowTide())}`, 'bad');
  if (night && k !== 'beach' && k !== 'flat') {
    torch = usableTorch();

  }
  if (!canAct(1)) return;
  const st = stackOf(card);
  act(30, night ? 6 : 4, () => {
    SND.q('explore_' + k);

    if (night) appear('nighteye');
    const P = S.places[k];
    if (k !== 'flat') { // 갯벌은 탐사도 없음
      const before = P.exp; P.exp = Math.min(100, P.exp + 5);

    }
    if (S.storm) { dmg(10, '폭풍'); SND.q('hurt'); say('⛈️ 폭풍 속에서는 아무것도 찾지 못했다. 체력 −10', 'bad'); return; }
    if (!S.rain && !night && S.thirst <= 20) heatUp(.3, '🥵 목이 탄 채 뙤약볕 아래를 돌아다녔다. 체온 +0.3℃');
    // 결과 굴리기
    let roll = rnd() * 100, got = null;
    for (const [rk, pr, pool] of dropTable(k)) {

    if (rnd() < inj) { SND.q('hurt'); S.injured = 1440; say('🩹 다쳤다! 24시간 동안 체력이 서서히 줄어든다.', 'bad'); }
    if (night && rnd() < .05 * nr) { SND.q('boar'); dmg(10, '밤짐승'); say('🐗 어둠 속에서 짐승과 마주쳤다! 체력 −10', 'bad'); }

function eat(card) {

function drinkCatcher(card) {

/* ---------- 쉬기 ---------- */
function openRest() {

    🌡️ 체온 ${S.temp.toFixed(1)}℃ ${tb.nm} → 쉬는 동안 ${Math.abs(tr.net) < .005 ? '그대로' : (tr.net > 0 ? '+' : '−') + Math.abs(tr.net).toFixed(2) + '℃/시간'}${tr.net > 0 && S.temp < TEMP_N && !tr.fever ? ' (36.5까지)' : ''}<br>
    <span class="muted">몸을 데우는 것: 🔥 모닥불, 🛖 오두막에서 쉬기, 맑은 낮. 식히는 것: 비, 밤 바깥, 폭풍. 열은 쉬면서 물을 마시면 내려요.</span></p>
    <div class="btns">

}
function rest(min) {
  closeSheet();
  const e0 = S.energy;
  act(min, 0, () => say(`💤 ${Math.round(min / 60 * 10) / 10}시간 쉬었다. 기운 +${Math.round(S.energy - e0)}`), 'rest');
}

/* ---------- 드롭 처리 ---------- */
const isPile = st => st.cards.length > 1 && st.cards.every(c => c.k === st.cards[0].k);
const allSame = cs => cs.every(c => c.k === cs[0].k);
function counts(cs) { const o = {}; for (const c of cs) { const k = c.k === 'vine' ? 'rope' : c.k; o[k] = (o[k] || 0) + 1; } return o; }
function eqCounts(a, b) { const ka = Object.keys(a), kb = Object.keys(b); return ka.length === kb.length && ka.every(k => a[k] === b[k]); }
function subCounts(a, b) { return Object.keys(a).every(k => (b[k] || 0) >= a[k]); }
// 이미 있는 시설·도구는 또 만들지 않고 그냥 쌓임 (도구는 내구 2 이하면 새로 만들 수 있음)
function existsOutside(kind, ings) { return allCards().some(c => c.k === kind && !ings.includes(c) && !(c.dur !== undefined && c.dur <= 2)); }
// 기지 시설(fac)은 일반 쌓기로는 만들어지지 않음 → 재료 더미를 🏕️ 기지 카드에 올릴 때만 (baseDrop)
function exactRecipe(cs, facOnly) {
  const c = counts(cs);
  return RECIPES.find(r => !!r.fac === !!facOnly && eqCounts(c, r.inp) && !(r.unique && r.unique.some(u => existsOutside(u, cs))));
}
function facMatch(cs) { const c = counts(cs); return RECIPES.find(r => r.fac && eqCounts(c, r.inp)); }
function partialRecipe(cs) { const c = counts(cs); return RECIPES.some(r => subCounts(c, r.inp)); }

// 고정 카드(장소·불·시설) 위에 카드를 올렸을 때
function fixedInteraction(a, b, bst) {
  const ak = a.k, bk = b.k;
  if (bk === 'fire') {
    if (K[ak].cook) {
      if (b.cook) return {msg:'🔥 이미 굽는 중이에요 (모닥불 조리 1개).'};
      return {run:() => { removeCards([a]); b.cook = {k:ak, until:S.t + 20}; SND.q('stack'); say(`${K[ak].e} ${K[ak].n}을(를) 불에 올렸다. 20분 뒤 익음 (다른 행동·쉬기로 시간이 흘러야 함)`); after(); }};
    }
    if (ak === 'stick' || ak === 'plank' || ak === 'log') {
      return {run:() => { const add = ak === 'log' ? 360 : 120; removeCards([a]); b.fuel = Math.min(720, b.fuel + add); discover('fuel'); SND.q('fuel'); say(`🔥 연료 +${add / 60}시간 (남은 연료 ${fmtH(b.fuel)})`); after(); }};
    }
    if (ak === 'torchx' || (ak === 'torch' && a.dur < 4)) {
      return {e:0, run:() => { act(5, 0, () => { a.k = 'torch'; a.dur = 4; discover('relight'); SND.q('ignite'); say('🕯️ 횃불이 다시 붙었다 (내구 4).', 'good'); }); }};
    }
    if (ak === 'ember') return {msg:'이미 타고 있어요.'};
    return {msg:'불에 올릴 수 없는 카드예요.'};
  }
  if (bk === 'firex') {
    if (ak === 'ember') return {e:1, run:() => { removeCards([a]); act(10, 1, () => { b.k = 'fire'; b.fuel = 180; discover('relightfire'); SND.q('ignite'); say('🔥 모닥불을 다시 피웠다 (연료 3시간).', 'good'); }); }};
    return null;
  }
  if (bk === 'jungle' && (ak === 'sharp' || ak === 'knife')) {
    const t = ak === 'sharp' ? 60 : 40, e = ak === 'sharp' ? 8 : 6;
    return {e, run:() => act(t, e, () => {
      const p = S.places.jungle.pools.log;
      wear(a);
      if (p[0] <= 0) return say('🌴 벨 만한 나무가 없다 (통나무 고갈).', 'bad');
      p[0]--; SND.q('chop'); spawnNear(mk('log'), bst); discover('chop'); say(`🪵 통나무를 베었다 (${t}분).`);
    })};
  }
  if (bk === 'sea' && (ak === 'spear' || ak === 'rod')) {
    if (S.storm) return {msg:'⛈️ 폭풍 중에는 낚시를 할 수 없어요.'};
    const sp = ak === 'spear';
    const t = sp ? 30 : 60, e = (sp ? 10 : 4) * (hasTrait('seaman') ? .7 : 1), ch = sp ? .6 : .7;
    return {e, run:() => act(t, e, () => {
      wear(a);
      const p = S.places.sea.pools.fish;
      discover(sp ? 'fish_spear' : 'fish_rod'); SND.q('splash');
      if (p[0] > 0 && rnd() < ch) { p[0]--; spawnNear(mk('fish'), bst); SND.q('catch'); say(`🐟 물고기를 잡았다! (${sp ? '창' : '낚싯대'})`, 'good'); appear('seaman'); }
      else say(p[0] > 0 ? '🌊 놓쳤다…' : '🌊 물고기가 보이지 않는다 (어획 고갈).');
      if (sp && !isNight() && rnd() < .03) { SND.q('hurt'); S.injured = 1440; say('🩹 창 낚시 중 다쳤다!', 'bad'); }
    })};
  }
  if (K[bk].cat === 'place') return {msg: bk === 'sea' ? '🌊 도구는 버릴 수 없어요. (창·낚싯대는 낚시)' : '장소는 탭해서 살펴요. (도구: 정글←날 선 돌/칼, 얕은 바다←창/낚싯대 · 버리기: 얕은 바다)'};
  if (bk === 'compost') return {msg:'🪱 퇴비 더미에는 상한 음식·생선뼈·해초만 넣을 수 있어요.'};
  return null;
}
// 도구 + 재료 (도구는 내구 −1, 재료만 소모)
function toolPair(tool, item, ist) {
  const tk = tool.k, ik = item.k;
  if ((tk === 'sharp' || tk === 'knife') && ik === 'coco')

    }).join('')}

}

/* ---------- 사운드 (Web Audio 합성만 사용, 외부 파일 없음) ---------- */
const SND = (() => {
  const KEY = 'cardIsland.sound.v1';
  const set = {on:true, bgm:.7, sfx:.7};
  try { Object.assign(set, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(set)); } catch (e) {} };
  let ctx = null, master, amb, sfx, white, brown, timer = null, unlocked = false, voices = 0, built = false;
  const L = {};
  const MAXV = 16;          // 동시 재생 상한 (단발음)
  const SFXB = 1.5;         // 효과음이 배경에 묻히지 않게 살짝 올림
  const nextAt = {};
  const mix = {day:1, dusk:0, night:0, cricket:0, fire:0, rain:0, storm:0, thunder:0, dead:0};
  let applied = '';
  let prevDanger = null;
  const qset = [];
  const now = () => ctx.currentTime;
  const R = (a, b) => a + Math.random() * (b - a);

  function noiseBuf(kind, sec) {
    const n = Math.floor(ctx.sampleRate * sec), b = ctx.createBuffer(1, n, ctx.sampleRate), d = b.getChannelData(0);
    let last = 0, mx = 0;
    for (let i = 0; i < n; i++) {
      const w = Math.random() * 2 - 1;
      if (kind === 'brown') { last = (last + .02 * w) / 1.02; d[i] = last; } else d[i] = w;
      mx = Math.max(mx, Math.abs(d[i]));
    }
    if (kind === 'brown') for (let i = 0; i < n; i++) d[i] /= mx; // 정규화
    return b;
  }
  function lfo(freq, amount, param) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.value = freq; g.gain.value = amount; o.connect(g); g.connect(param); o.start(); return o;
  }
  // 반복 재생 배경 레이어: 버퍼 → 필터들 → 스웰 → 레벨 → 배경음 버스
  function layer(buf, filters, swellBase) {
    const s = ctx.createBufferSource(); s.buffer = buf; s.loop = true;
    let node = s;
    const fs = filters.map(([type, f, q]) => { const fl = ctx.createBiquadFilter(); fl.type = type; fl.frequency.value = f; fl.Q.value = q || .7; node.connect(fl); node = fl; return fl; });
    const swell = ctx.createGain(); swell.gain.value = swellBase; node.connect(swell);
    const g = ctx.createGain(); g.gain.value = 0; swell.connect(g); g.connect(amb);
    s.start(0, Math.random() * (buf.duration - .1));
    return {s, fs, swell, g};
  }
  function build() {
    master = ctx.createGain(); master.gain.value = set.on ? 1 : 0;
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -20; comp.knee.value = 12; comp.ratio.value = 4; comp.attack.value = .005; comp.release.value = .3;
    master.connect(comp); comp.connect(ctx.destination);
    amb = ctx.createGain(); amb.gain.value = set.bgm; amb.connect(master);
    sfx = ctx.createGain(); sfx.gain.value = set.sfx * SFXB; sfx.connect(master);
    white = noiseBuf('white', 2); brown = noiseBuf('brown', 4);
    // 낮: 파도 (느린 스웰), 잎·바람 바스락
    L.waves = layer(brown, [['lowpass', 520, .5]], .55);
    lfo(.075, .4, L.waves.swell.gain); lfo(.075, 260, L.waves.fs[0].frequency);
    L.leaves = layer(white, [['bandpass', 3300, .6]], .5);
    lfo(.13, .45, L.leaves.swell.gain);
    // 밤: 낮은 바람 드론 + 아주 작은 저음
    L.wind = layer(brown, [['lowpass', 230, .9]], .6);
    lfo(.045, .35, L.wind.swell.gain); lfo(.03, 110, L.wind.fs[0].frequency);
    const dr = ctx.createOscillator(); dr.type = 'sine'; dr.frequency.value = 73.4;
    L.drone = {g:ctx.createGain()}; L.drone.g.gain.value = 0; dr.connect(L.drone.g); L.drone.g.connect(amb); dr.start();
    lfo(.11, 1.5, dr.frequency);

    L.fire = layer(brown, [['bandpass', 800, .6]], .7);
    lfo(.6, .25, L.fire.swell.gain);
    // 비
    L.rain = layer(white, [['highpass', 650, .5], ['lowpass', 6500, .5]], .8);
    lfo(.09, .15, L.rain.swell.gain);
    built = true; applied = ''; apply();
  }
  function ensure() {
    if (!set.on) return false;
    try {
      if (!ctx) {
        const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return false;
        try { ctx = new AC({latencyHint:'playback'}); } catch (e) { ctx = new AC(); }
        build();
      }
      if (ctx.state !== 'running' && !document.hidden) ctx.resume().catch(() => {});
      if (!unlocked) { // iOS: 무음 버퍼 한 번 재생해서 잠금 해제
        const b = ctx.createBuffer(1, 1, 22050), s = ctx.createBufferSource(); s.buffer = b; s.connect(ctx.destination); s.start(0); unlocked = true;
      }
      startTimer();
      return true;
    } catch (e) { console.warn('audio', e); return false; }
  }
  const live = () => ctx && built && set.on && ctx.state === 'running';
  function track(src, last) { voices++; src.onended = () => { voices--; try { last.disconnect(); } catch (e) {} }; }
  function dest(bus, pan) {
    if (pan && ctx.createStereoPanner) { const p = ctx.createStereoPanner(); p.pan.value = pan; p.connect(bus); return p; }
    return bus;
  }
  function env(g, t, a, v, d) {
    g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(.0002, v), t + a);
    g.gain.exponentialRampToValueAtTime(.0001, t + a + d);
  }
  function tone(o) {
    const {f, f2, t = now(), a = .005, d = .15, type = 'sine', v = .1, bus = sfx, pan = 0, lp, cap = MAXV} = o;
    if (voices >= cap) return;
    const os = ctx.createOscillator(); os.type = type; os.frequency.setValueAtTime(f, t);
    if (f2) os.frequency.exponentialRampToValueAtTime(f2, t + a + d);
    const g = ctx.createGain(); env(g, t, a, v, d);
    let n = os; if (lp) { const fl = ctx.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = lp; os.connect(fl); n = fl; }
    n.connect(g); g.connect(dest(bus, pan));
    os.start(t); os.stop(t + a + d + .05); track(os, g);
  }
  function noise(o) {
    const {t = now(), a = .003, d = .05, type = 'bandpass', f = 1000, f2, q = 1, v = .1, bus = sfx, pan = 0, buf = white, cap = MAXV} = o;
    if (voices >= cap) return;
    const s = ctx.createBufferSource(); s.buffer = buf;
    const fl = ctx.createBiquadFilter(); fl.type = type; fl.frequency.setValueAtTime(f, t); fl.Q.value = q;
    if (f2) fl.frequency.exponentialRampToValueAtTime(f2, t + a + d);
    const g = ctx.createGain(); env(g, t, a, v, d);
    s.connect(fl); fl.connect(g); g.connect(dest(bus, pan));
    s.start(t, Math.random() * (buf.duration - 1)); s.stop(t + a + d + .05); track(s, g);
  }

  /* --- 효과음 --- */
  const FX = {
    pickup(t) { tone({t, f:480, f2:720, d:.07, v:.07, type:'triangle'}); noise({t, f:3000, d:.02, v:.03}); },
    drop(t) { noise({t, type:'lowpass', f:900, d:.07, v:.16}); tone({t, f:170, f2:110, d:.08, v:.08}); },
    stack(t) { FX.drop(t); noise({t:t + .05, type:'bandpass', f:2200, d:.03, v:.05}); tone({t:t + .05, f:620, d:.06, v:.035, type:'triangle'}); },
    reject(t) { tone({t, f:300, f2:210, d:.14, v:.06, type:'triangle'}); },
    craft(t) { [523, 659, 784].forEach((f, i) => tone({t:t + i * .07, f, d:.16, v:.07, type:'triangle'})); },
    discover(t) { // 처음 알아낸 조합: 맑은 종소리 + 반짝임
      [[784, 0], [1047, .12], [1319, .24], [1568, .36]].forEach(([f, dt]) => { tone({t:t + dt, f, d:1.1, v:.06}); tone({t:t + dt, f:f * 2.01, d:.6, v:.015}); });
      for (let i = 0; i < 5; i++) tone({t:t + .45 + i * .05, f:2600 + i * 260, d:.12, v:.012, pan:R(-.5, .5)});
    },
    ignite(t) { noise({t, a:.05, d:.45, type:'bandpass', f:500, f2:2800, q:.8, v:.12}); tone({t, a:.1, d:.5, f:90, f2:140, v:.06}); for (let i = 0; i < 4; i++) noise({t:t + .15 + i * R(.05, .12), type:'highpass', f:2500, d:.012, v:.05}); },
    fuel(t) { noise({t, a:.03, d:.3, type:'bandpass', f:700, f2:1600, q:.8, v:.07}); },
    fizzle(t) { noise({t, a:.01, d:.6, type:'highpass', f:4000, f2:1800, v:.05}); tone({t, f:200, f2:110, d:.25, v:.04}); },
    eat(t) { for (let i = 0; i < 3; i++) noise({t:t + i * .12, type:'bandpass', f:R(1200, 2000), q:1.5, d:.05, v:.11}); },
    drink(t) { for (let i = 0; i < 3; i++) tone({t:t + i * .17, f:280, f2:520, a:.01, d:.08, v:.08, lp:1200}); },
    break(t) { noise({t, type:'highpass', f:2500, d:.06, v:.12}); tone({t, f:900, f2:260, d:.18, v:.06, type:'triangle'}); noise({t:t + .07, type:'bandpass', f:1500, d:.05, v:.07}); },
    explore_beach(t) { noise({t, a:.12, d:.4, type:'lowpass', f:1400, v:.07}); noise({t:t + .2, type:'bandpass', f:2000, d:.04, v:.03}); },
    explore_sea(t) { noise({t, a:.08, d:.5, type:'lowpass', f:1800, f2:600, v:.1}); tone({t:t + .05, f:600, f2:300, d:.12, v:.03}); },
    explore_jungle(t) { noise({t, a:.08, d:.25, type:'bandpass', f:2800, q:.7, v:.08}); noise({t:t + .28, a:.06, d:.22, type:'bandpass', f:3300, q:.7, v:.06}); },
    explore_ledge(t) { tone({t, f:1200, d:.04, v:.05, type:'square', lp:2500}); tone({t:t + .13, f:900, d:.05, v:.045, type:'square', lp:2500}); noise({t, type:'bandpass', f:1800, d:.05, v:.04}); },
    splash(t) { noise({t, a:.02, d:.45, type:'lowpass', f:2500, f2:500, v:.12}); for (let i = 0; i < 3; i++) tone({t:t + .05 + i * .06, f:R(700, 1100), f2:300, d:.06, v:.02}); },
    toss(t) { tone({t, f:520, f2:180, d:.09, v:.06}); noise({t:t + .07, a:.01, d:.32, type:'lowpass', f:2200, f2:450, v:.11}); tone({t:t + .1, f:R(800, 1000), f2:350, d:.05, v:.02}); },
    squelch(t) { noise({t, a:.02, d:.22, type:'bandpass', f:420, f2:180, q:3, v:.16, buf:brown}); tone({t, f:150, f2:70, a:.01, d:.2, v:.07, lp:500}); noise({t:t + .12, a:.01, d:.1, type:'bandpass', f:900, f2:300, q:4, v:.06}); },
    catch(t) { tone({t, f:659, d:.15, v:.06, type:'triangle'}); tone({t:t + .1, f:988, d:.25, v:.06, type:'triangle'}); },
    chop(t) { for (let i = 0; i < 2; i++) { tone({t:t + i * .2, f:160, f2:80, d:.12, v:.1}); noise({t:t + i * .2, type:'lowpass', f:1500, d:.06, v:.1}); } },
    sick(t) { tone({t, f:330, f2:200, a:.05, d:.5, v:.05, type:'triangle'}); tone({t, f:336, f2:190, a:.05, d:.5, v:.04, type:'triangle'}); },
    hurt(t) { tone({t, f:130, f2:60, d:.22, v:.12}); noise({t, type:'lowpass', f:800, d:.08, v:.08}); },
    warn(t) { // 상태 위험: 부드러운 심장 박동 두 번 + 낮은 경고음
      for (let k = 0; k < 2; k++) { tone({t:t + k * .55, f:62, f2:45, d:.16, v:.2}); tone({t:t + k * .55 + .17, f:58, f2:42, d:.14, v:.14}); }
      tone({t, f:440, f2:415, a:.08, d:.6, v:.025, type:'triangle'});
    },
    boar(t) { boarSound(t, sfx, .16, 0, 520); noise({t:t + .5, type:'lowpass', f:600, d:.15, v:.12}); tone({t:t + .5, f:110, f2:55, d:.25, v:.1}); },
    death(t) {
      [[440, 0], [349, .45], [262, .9]].forEach(([f, dt]) => tone({t:t + dt, f, a:.05, d:1.4, v:.07, type:'triangle', lp:1800}));
      tone({t, f:65, a:.6, d:2.6, v:.08});
    },
  };
  function boarSound(t, bus, v, pan, lp) { // 낮은 숨소리 + 꿀꿀
    if (voices >= MAXV - 1) return;
    noise({t, a:.25, d:.45, type:'lowpass', f:500, v:v * .5, bus, pan, buf:brown, cap:12});
    const os = ctx.createOscillator(); os.type = 'sawtooth'; os.frequency.setValueAtTime(85, t + .5); os.frequency.linearRampToValueAtTime(65, t + .95);
    const am = ctx.createGain(); am.gain.value = .5; const l = ctx.createOscillator(); l.frequency.value = 22; const lg = ctx.createGain(); lg.gain.value = .5; l.connect(lg); lg.connect(am.gain);

    const g = ctx.createGain(); env(g, t + .5, .05, v, .45);

    os.start(t + .5); l.start(t + .5); os.stop(t + 1.05); l.stop(t + 1.05); track(os, g);

  const AMBV = 11; // 배경 이벤트는 상한을 더 낮게
  const EV = {
    bird: {w:() => mix.day * (1 - mix.rain * .7), gap:[2.5, 8], fn:() => {
      const t = now() + .02, base = R(2300, 3600), pan = R(-.7, .7), n = 2 + Math.floor(R(0, 3));
      for (let i = 0; i < n; i++) tone({t:t + i * R(.09, .14), f:base, f2:base * R(1.15, 1.4), a:.01, d:.07, v:.035 * mix.day, bus:amb, pan, cap:AMBV});
    }},
    cricket: {w:() => mix.cricket * (1 - mix.rain * .5), gap:[.35, 1.1], fn:() => {
      const t = now() + .02, f = R(4300, 4900), pan = R(-.8, .8);
      for (let i = 0; i < 3; i++) tone({t:t + i * .035, f, a:.004, d:.018, v:.012 * mix.cricket * (mix.fire ? .7 : 1), bus:amb, pan, cap:AMBV});
    }},
    twig: {w:() => mix.night * (mix.fire ? .6 : 1), gap:[12, 32], fn:() => {
      const t = now() + .02, pan = R(-.9, .9), v = .05 * (mix.fire ? .55 : 1);
      noise({t, type:'bandpass', f:R(2200, 3200), q:2, d:.015, v, bus:amb, pan, cap:AMBV});
      noise({t:t + R(.06, .12), type:'bandpass', f:R(1800, 2600), q:2, d:.012, v:v * .6, bus:amb, pan, cap:AMBV});
    }},
    boar: {w:() => mix.night * (mix.fire ? .35 : 1), gap:[22, 55], fn:() => boarSound(now() + .05, amb, .05 * (mix.fire ? .45 : 1), R(-.8, .8), 300)},
    crackle: {w:() => mix.fire, gap:[.06, .4], fn:() => {
      noise({t:now() + .01, type:'highpass', f:R(1500, 3500), d:R(.004, .02), v:R(.015, .04) * mix.fire, bus:amb, pan:R(-.3, .3), cap:AMBV});
    }},
    thunder: {w:() => mix.thunder, gap:[14, 36], fn:() => {
      const t = now() + .05, v = .22 * (mix.storm ? 1 : .7);
      noise({t, a:.4, d:R(2.5, 4), type:'lowpass', f:R(140, 220), f2:70, q:.5, v, bus:amb, pan:R(-.5, .5), buf:brown, cap:AMBV + 2});
      noise({t:t + R(.3, .8), a:.2, d:1.5, type:'lowpass', f:300, f2:90, v:v * .5, bus:amb, buf:brown, cap:AMBV + 2});
    }},
  };
  function tick() {
    if (!live()) return;
    const t = now();
    for (const [k, e] of Object.entries(EV)) {
      const w = e.w();
      if (w < .05) { nextAt[k] = 0; continue; }
      if (!nextAt[k]) { nextAt[k] = t + R(e.gap[0], e.gap[1]) / Math.max(w, .25); continue; }
      if (t >= nextAt[k]) { if (voices < AMBV) e.fn(); nextAt[k] = t + R(e.gap[0], e.gap[1]) / Math.max(w, .25); }
    }
  }
  function startTimer() { if (!timer) timer = setInterval(tick, 150); }
  function stopTimer() { if (timer) { clearInterval(timer); timer = null; } }

  /* --- 게임 상태 → 배경 믹스 (크로스페이드) --- */
  function phase(m) {
    const h = m / 60;
    if (h >= 6 && h < 17) return [1, 0, 0];
    if (h >= 17 && h < 18) { const f = h - 17; return [1 - f, Math.sin(Math.PI * f), f]; }
    if (h >= 18 || h < 5) return [0, 0, 1];
    const f = h - 5; return [f, Math.sin(Math.PI * f) * .5, 1 - f];
  }
  function update(S) {
    if (!S) return;
    const m = S.t % 1440, d = Math.floor(S.t / 1440) + 1;
    const [dy, dk, nt] = phase(m);
    mix.day = dy; mix.dusk = dk; mix.night = nt;
    mix.cricket = Math.min(1, nt * .8 + dk * .6);
    mix.fire = S.stacks.some(st => st.cards.some(c => c.k === 'fire')) ? 1 : 0;
    mix.rain = (S.rain || S.storm) ? 1 : 0;
    mix.storm = S.storm ? 1 : 0;
    // 7일차 큰 폭풍 전날 저녁(6·13·20…일차 17시~) 먼 천둥으로 예고. 폭풍 중(S.storm)에는 빗소리가 커지고 천둥이 잦아짐
    mix.thunder = mix.storm ? 1.6 : ((d % 7 === 6 && m >= 1020) || (d % 7 === 0 && m >= 360 && m < 720)) ? 1 : 0;
    mix.dead = S.dead ? 1 : 0;
    // 상태 위험 경고: 위험 구간에 새로 들어갈 때만
    const dg = {hp:S.hp <= 20, hunger:S.hunger <= 20, thirst:S.thirst <= 20, energy:S.energy <= 20, cold:S.temp < 35, fever:S.temp > 38.5};
    if (prevDanger && !S.dead && Object.keys(dg).some(k => dg[k] && !prevDanger[k])) q('warn');
    prevDanger = dg;
    apply();
  }
  function apply() {
    if (!built) return;
    const fireMask = mix.fire ? .55 : 1, deadMul = mix.dead ? .35 : 1;
    const tg = {
      waves:(.24 * (mix.day + mix.dusk * .5) + .12 * mix.night) * (mix.storm ? 1.4 : 1),
      leaves:.07 * mix.day * (1 - mix.rain * .6),
      wind:.32 * mix.night * fireMask + (mix.storm ? .2 : 0),
      drone:.022 * mix.night * fireMask,
      fire:.22 * mix.fire,
      rain:mix.rain ? (mix.storm ? .24 : .11) : 0,
    };
    const key = JSON.stringify(tg) + deadMul;
    if (key === applied) return; applied = key;
    const t = now();
    for (const [k, v] of Object.entries(tg)) L[k].g.gain.setTargetAtTime(v * deadMul, t, 1.3);
  }

  /* --- 효과음 대기열: 한 행동의 결과음을 모아 재생 (처음 알아낸 조합이면 일반 조합음 생략) --- */
  function q(name) { if (!qset.includes(name)) qset.push(name); }
  function flushQ() {
    let list = qset.splice(0);
    if (list.includes('discover')) list = list.filter(n => n !== 'craft' && n !== 'catch');
    if (list.includes('death')) list = ['death'];
    if (!live()) return;
    list.slice(0, 4).forEach((n, i) => { if (FX[n]) { FX[n](now() + .02 + i * .12); log(n); } });
  }
  const played = [];
  function log(n) { played.push(n); if (played.length > 40) played.shift(); }
  function play(name) { if (live() && FX[name]) { FX[name](now() + .01); log(name); } }

  /* --- 설정 --- */
  function setOn(v) {
    set.on = v; save();
    if (v) { ensure(); if (master) master.gain.setTargetAtTime(1, now(), .05); }
    else if (ctx) { master.gain.setTargetAtTime(0, now(), .05); stopTimer(); setTimeout(() => { if (!set.on) ctx.suspend().catch(() => {}); }, 200); }
  }
  function setVol(which, v) {
    set[which] = v; save();
    if (built) (which === 'bgm' ? amb : sfx).gain.setTargetAtTime(which === 'bgm' ? v : v * SFXB, now(), .05);
  }
  function onVisibility() {
    if (!ctx) return;
    if (document.hidden) { stopTimer(); ctx.suspend().catch(() => {}); }
    else if (set.on) { ctx.resume().catch(() => {}); startTimer(); }
  }
  ['pointerdown', 'touchend', 'click', 'keydown'].forEach(ev => document.addEventListener(ev, ensure, {capture:true, passive:true}));
  document.addEventListener('visibilitychange', onVisibility);
  window.addEventListener('pagehide', () => { if (ctx) ctx.suspend().catch(() => {}); });
  return {
    play, q, flushQ, update, setOn, setVol, ensure, settings:set, played, FXNAMES:Object.keys(FX),
    get ctx() { return ctx; }, get voices() { return voices; }, get built() { return built; }, get master() { return master; }, get mix() { return mix; }, layers:L,
  };
})();
function syncSndBtn() { const b = $('#bSnd'); if (b) b.textContent = SND.settings.on ? '🔊' : '🔇'; }

/* ---------- 시작 ---------- */
function boot() {
  measure();
  syncSndBtn();
  let run = null;
  try { run = JSON.parse(localStorage.getItem(RUN_KEY) || 'null'); } catch (e) {}
  if (run && run.v === VERSION) {
    S = run;
    if (!S.st100) { S.hunger = 100 - S.hunger; S.thirst = 100 - S.thirst; S.st100 = 1; saveRun(); } // 〔v0.5〕 상태 100 기준으로 옮기기
    if (typeof S.temp !== 'number' || S.temp > 45) { S.temp = 36.5; saveRun(); } // 〔v0.5 확정: 체온〕 예전 저장은 36.5℃로 시작
    if (S.dead) { render(); showDeath(); return; }
    sortBoardIfOff(); render();
  } else { newGame(meta.unlocked.stone && meta.lastTraits ? meta.lastTraits.filter(id => meta.unlocked[id]) : [], false); render(); }
  if (!meta.seenHelp) showHelp();
}
function sortBoardIfOff() { if (S.stacks.some(st => st.x + D.cw > D.W + 2)) sortBoard(true); }
window.__game = {snd:SND, tide:{open:() => flatOpen(), windows:tideWindows}, get S() { return S; }, get meta() { return meta; }, sortBoard, render, D, K, advance:(m) => { advance(m); after(); }};
boot();
</script>
